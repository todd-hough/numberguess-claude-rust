[package]
name = "number_guessing_game"
version = "0.1.0"
edition = "2024"

[lib]
name = "number_guessing_game"
path = "src/lib.rs"

[[bin]]
name = "number_guessing_game"
path = "src/main.rs"

[dependencies]
rand = "0.9.2"
clap = { version = "4.5.45", features = ["derive"] }
axum = "0.8.4"
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate"] }
dotenvy = "0.15"
thiserror = "2.0"
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

[dev-dependencies]
reqwest = { version = "0.12.23", features = ["json", "blocking"] }
testcontainers = { version = "0.23", features = ["blocking"] }
tokio-test = "0.4"
assert_cmd = "2.0"
predicates = "3.0"
serial_test = "3.0"
bollard = "0.18"
thirtyfour = "0.33.0"  # WebDriver client for browser testing