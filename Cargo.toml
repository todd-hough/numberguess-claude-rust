[package]
name = "number_guessing_game"
version = "0.1.0"
edition = "2021"

[lib]
name = "number_guessing_game"
path = "src/lib.rs"

[[bin]]
name = "number_guessing_game"
path = "src/main.rs"

[dependencies]
rand = "0.8.5"
clap = { version = "4.5", features = ["derive"] }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
