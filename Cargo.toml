[package]
name = "number_guessing_game"
version = "0.1.0"
edition = "2024"

[lib]
name = "number_guessing_game"
path = "src/lib.rs"

[[bin]]
name = "number_guessing_game"
path = "src/main.rs"

[dependencies]
rand = "0.9.2"
clap = { version = "4.5.51", features = ["derive"] }
axum = "0.8.6"
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "fs", "trace"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate"] }
dotenvy = "0.15"
thiserror = "2.0"
askama = "0.14"
askama_web = { version = "0.14", features = ["axum-0.8", "tracing-0.1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
reqwest = { version = "0.12.23", features = ["json", "blocking"] }
assert_cmd = "2.0"
predicates = "3.0"
thirtyfour = "0.36.1"  # WebDriver client for browser testing
