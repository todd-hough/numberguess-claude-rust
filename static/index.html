<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .game-form {
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        #game-area {
            display: none;
        }
        
        #game-area.active {
            display: block;
        }
        
        .game-info {
            background: #f7f7f7;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .game-info h2 {
            color: #555;
            margin-bottom: 10px;
        }
        
        .range-display {
            font-size: 1.2em;
            color: #667eea;
            font-weight: 600;
        }
        
        .guess-form {
            margin-bottom: 20px;
        }
        
        .guess-input-group {
            display: flex;
            gap: 10px;
        }
        
        .guess-input-group input {
            flex: 1;
        }
        
        .guess-input-group button {
            width: auto;
            padding: 12px 30px;
        }
        
        #feedback {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }
        
        #feedback.active {
            display: block;
        }
        
        #feedback.too-low {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        
        #feedback.too-high {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        
        #feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .new-game-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }
        
        .new-game-btn:hover {
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.4);
        }
        
        .new-game-link {
            display: inline-block;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .new-game-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .htmx-indicator {
            display: none;
        }
        
        .htmx-request .htmx-indicator {
            display: inline-block;
            margin-left: 10px;
        }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Number Guessing Game</h1>
        
        <div id="setup-area">
            <form class="game-form" 
                  hx-post="/game/new" 
                  hx-target=".container" 
                  hx-swap="innerHTML">
                <div class="form-group">
                    <label for="min">Minimum Number (0 to 1,000,000):</label>
                    <input type="number" id="min" name="min" value="1" min="0" max="1000000" required>
                </div>
                <div class="form-group">
                    <label for="max">Maximum Number (0 to 1,000,000):</label>
                    <input type="number" id="max" name="max" value="100" min="0" max="1000000" required>
                </div>
                <div class="form-group">
                    <label for="max_guesses">Guess Limit (Optional, max 100):</label>
                    <input type="number" id="max_guesses" name="max_guesses" min="0" max="100" placeholder="Leave blank for no limit">
                </div>
                <button type="submit">
                    Start New Game
                    <span class="htmx-indicator">
                        <span class="spinner"></span>
                    </span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
