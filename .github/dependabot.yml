# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# SECURITY-ONLY MODE (hobby project): open-pull-requests-limit: 0 disables
# routine version-update PRs; Dependabot still opens PRs for security
# advisories. Rationale: weekly version PRs and their emails were pure noise
# on an idle repo, and the CI pins (rust-toolchain.toml, cargo-chef, trivy)
# already fail loudly at PR time if something rots. To catch up versions
# deliberately, run `cargo update` on a branch (see
# plans/version-upgrades-july-2026.md for the recipe).
version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"

  # Docker dependencies (Dockerfile, docker-compose.yml)
  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
