name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    # Build Docker image for integration tests
    - name: Build Docker image
      run: |
        docker build -t numberguess-claude-rust:latest .

    - name: Verify Docker image
      run: |
        docker images | grep numberguess-claude-rust

    # Run unit tests (no Docker needed)
    - name: Run unit tests
      run: cargo test --lib

    # Run integration tests (uses Docker)
    - name: Run integration tests
      run: |
        cargo test --test integration_test
        cargo test --test web_endpoints_test
        cargo test --test api_edge_cases_test

    # Run web UI tests (uses Docker + Selenium)
    - name: Run web UI tests
      run: cargo test --test web_ui_test

    - name: Check code formatting
      run: cargo fmt --check

    - name: Run clippy
      run: cargo clippy -- -D warnings