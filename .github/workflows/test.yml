name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    # Build Docker image for integration tests
    - name: Build Docker image
      run: |
        docker build --build-arg BUILD_TYPE=debug -t numberguess-claude-rust:latest .

    - name: Verify Docker image
      run: |
        docker images | grep numberguess-claude-rust

    # Run unit tests (no Docker needed)
    - name: Run unit tests
      run: cargo test --lib

    # Start Docker Compose services for integration tests
    - name: Start integration test services
      run: |
        docker compose -f docker-compose.yml -f docker-compose.integration.yml --profile integration up -d --wait
        echo "All services are healthy and ready"

    # Run integration tests (uses Docker)
    - name: Run integration tests
      env:
        GAME_SERVER_BASE_URL: http://localhost:8080
        GAME_SERVER_BROWSER_URL: http://oauth2-proxy:4180
        SELENIUM_REMOTE_URL: http://localhost:4444
        TEST_DB_NAME: numberguess_test
      run: |
        cargo test --tests -- --test-threads=1

    # Cleanup: Stop integration test services
    - name: Stop integration test services
      if: always()
      run: |
        docker compose -f docker-compose.yml -f docker-compose.integration.yml --profile integration down -v

    - name: Check code formatting
      run: cargo fmt --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

