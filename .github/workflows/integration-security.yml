name: Integration & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scans on Sundays at midnight UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image (debug mode)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: BUILD_TYPE=debug
          tags: numberguess:${{ github.sha }}
          outputs: type=docker,dest=/tmp/numberguess-docker-image.tar
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/numberguess-docker-image.tar
          retention-days: 1

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload Hadolint results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - uses: actions/checkout@v5

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Clean up any cached images
        run: docker system prune -af --volumes || true

      - name: Load Docker image
        run: docker load --input /tmp/numberguess-docker-image.tar

      - name: Verify loaded image
        run: |
          echo "=== All Docker images ==="
          docker images
          echo ""
          echo "=== Looking for numberguess images ==="
          docker images | grep numberguess
          echo ""
          echo "=== Checking for our specific tag ==="
          if ! docker images | grep -q "numberguess.*${{ github.sha }}"; then
            echo "ERROR: Image with tag ${{ github.sha }} not found!"
            exit 1
          fi
          echo "✓ Image found with correct tag"

      - name: Run Trivy vulnerability scanner (enforce HIGH/CRITICAL check)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: numberguess:${{ github.sha }}
          version: v0.67.2
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'  # Fail the build if HIGH/CRITICAL found

      - name: Run Trivy vulnerability scanner (SARIF for GitHub Security)
        uses: aquasecurity/trivy-action@master
        if: always()  # Run even if previous step failed
        with:
          image-ref: numberguess:${{ github.sha }}
          version: v0.67.2
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'  # Don't fail - SARIF is just for reporting

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/numberguess-docker-image.tar

      - name: Verify Docker image
        run: docker images | grep numberguess

      - name: Start integration test services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.integration.yml --profile integration up -d --wait
          echo "All services are healthy and ready"

      - name: Run integration tests
        env:
          GAME_SERVER_BASE_URL: http://localhost:8080
          GAME_SERVER_BROWSER_URL: http://oauth2-proxy:4180
          SELENIUM_REMOTE_URL: http://localhost:4444
          TEST_DB_NAME: numberguess_test
        run: cargo test --tests -- --test-threads=1

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== App logs ==="
          docker compose logs app
          echo "=== Keycloak logs ==="
          docker compose logs keycloak
          echo "=== oauth2-proxy logs ==="
          docker compose logs oauth2-proxy
          echo "=== Selenium logs ==="
          docker compose logs selenium

      - name: Stop integration test services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml --profile integration down -v
