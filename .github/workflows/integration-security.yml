name: Integration & Security

# Full suite runs when a PR to main is OPENED (the ready-to-merge signal),
# after merges to main/develop (safety net), or on demand via the Actions tab.
# Deliberately NOT on every PR push ('synchronize' omitted from types) and NOT
# on a schedule: the old weekly cron produced failing-scan emails on an idle
# hobby repo, and scheduled workflows get auto-disabled by GitHub after 60
# days of repo inactivity (which is how this workflow ended up disabled).
# To re-validate a PR after pushing more commits: Actions tab -> this
# workflow -> "Run workflow" on the branch, or close/reopen the PR.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image (debug mode)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: BUILD_TYPE=debug
          tags: numberguess:${{ github.sha }}
          outputs: type=docker,dest=/tmp/numberguess-docker-image.tar
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/numberguess-docker-image.tar
          retention-days: 1

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Informational only (hobby project): advisories in transitive deps
    # accumulate over time without any code change here, and this job used to
    # paint every run red because of them. It still runs and reports; it just
    # cannot fail the workflow. Run `cargo audit` / `cargo update` locally if
    # you want to act on its findings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload Hadolint results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - uses: actions/checkout@v5

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Clean Docker cache
        run: docker system prune -af --volumes || true

      - name: Load Docker image
        run: docker load --input /tmp/numberguess-docker-image.tar

      - name: Verify image loaded
        run: |
          docker images | grep numberguess
          if ! docker images | grep -q "numberguess.*${{ github.sha }}"; then
            echo "ERROR: Image with tag ${{ github.sha }} not found!"
            exit 1
          fi

      - name: Scan for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: numberguess:${{ github.sha }}
          version: v0.67.2
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Generate security report for GitHub
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: numberguess:${{ github.sha }}
          version: v0.67.2
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/numberguess-docker-image.tar

      - name: Verify Docker image
        run: docker images | grep numberguess

      - name: Tag loaded image for docker compose
        # Both test tiers reference numberguess-claude-rust:latest; without this
        # tag, docker compose would silently rebuild instead of using the
        # artifact built by the build-docker job.
        run: docker tag numberguess:${{ github.sha }} numberguess-claude-rust:latest

      # Both tiers run on every push: the light tier covers functional tests
      # (mock auth headers, no Keycloak/Selenium), the full tier covers the
      # OAuth2 flow and browser UI tests against the real auth stack.
      - name: Run functional tests (light tier, mock auth)
        run: |
          make test-func
          make test-func-down

      - name: Run auth + browser UI tests (full stack)
        run: make test-auth

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Light tier logs ==="
          docker compose -f docker-compose.test-mock-auth.yml -p numberguess-mock logs || true
          echo "=== App logs ==="
          docker compose logs app || true
          echo "=== Keycloak logs ==="
          docker compose logs keycloak || true
          echo "=== oauth2-proxy logs ==="
          docker compose logs oauth2-proxy || true
          echo "=== Selenium logs ==="
          docker compose logs selenium || true

      - name: Stop integration test services
        if: always()
        run: make test-down
