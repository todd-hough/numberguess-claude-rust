name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image (debug mode)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: BUILD_TYPE=debug
          tags: numberguess-claude-rust:latest
          outputs: type=docker,dest=/tmp/numberguess-docker-image.tar
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-integration
          path: /tmp/numberguess-docker-image.tar
          retention-days: 1

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-integration
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/numberguess-docker-image.tar

      - name: Verify Docker image
        run: docker images | grep numberguess-claude-rust

      - name: Start integration test services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.integration.yml --profile integration up -d --wait
          echo "All services are healthy and ready"

      - name: Run integration tests
        env:
          GAME_SERVER_BASE_URL: http://localhost:8080
          GAME_SERVER_BROWSER_URL: http://oauth2-proxy:4180
          SELENIUM_REMOTE_URL: http://localhost:4444
          TEST_DB_NAME: numberguess_test
        run: cargo test --tests -- --test-threads=1

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== App logs ==="
          docker compose logs app
          echo "=== Keycloak logs ==="
          docker compose logs keycloak
          echo "=== oauth2-proxy logs ==="
          docker compose logs oauth2-proxy
          echo "=== Selenium logs ==="
          docker compose logs selenium

      - name: Stop integration test services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml --profile integration down -v
