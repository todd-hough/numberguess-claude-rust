services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: numberguess
      POSTGRES_PASSWORD: password
      POSTGRES_DB: numberguess_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numberguess -d numberguess_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: numberguess-claude-rust:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://numberguess:password@postgres:5432/numberguess_dev
      RUST_LOG: debug
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full-stack
    # For development: uncomment to mount source and rebuild on changes
    # volumes:
    #   - ./src:/app/src
    #   - ./static:/app/static

volumes:
  postgres_data:
