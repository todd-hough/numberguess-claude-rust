services:
  postgres:
    image: postgres:16
    profiles:
      - dev
      - full-stack
      - integration
      - integration-ui
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-numberguess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-numberguess_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numberguess} -d ${POSTGRES_DB:-numberguess_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: numberguess-claude-rust:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-numberguess}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-numberguess_dev}
      RUST_LOG: debug
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full-stack
      - integration
      - integration-ui
    # For development: uncomment to mount source and rebuild on changes
    # volumes:
    #   - ./src:/app/src
    #   - ./static:/app/static

volumes:
  postgres_data:
