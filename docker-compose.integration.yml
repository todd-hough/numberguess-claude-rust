services:
  postgres:
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-numberguess_test}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-numberguess} -d ${TEST_DB_NAME:-numberguess_test}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - integration

  redis:
    profiles:
      - integration
    ports:
      - "6379:6379"  # Expose Redis port for test scripts

  keycloak:
    environment:
      # Override hostname to use Docker internal network name instead of localhost
      # This allows Selenium (running in Docker) to access Keycloak
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: 8090
    profiles:
      - integration
    # Removed postgres dependency - Keycloak uses H2 in-memory database
  oauth2-proxy:
    command:
      # Override redirect URL for integration tests to use internal Docker hostname
      # (Selenium browser runs inside Docker and needs to access oauth2-proxy via internal network)
      - --provider=oidc
      - --provider-display-name=Keycloak
      - --oidc-issuer-url=http://keycloak:8090/realms/numberguess
      - --client-id=numberguess-client
      - --client-secret=${OAUTH2_CLIENT_SECRET:-DEV-CLIENT-NOT-PRODUCTION-00000}
      - --redirect-url=http://oauth2-proxy:4180/oauth2/callback
      - --code-challenge-method=S256
      - --insecure-oidc-skip-issuer-verification=true
      - --upstream=http://app:4080
      - --http-address=0.0.0.0:4180
      - --session-store-type=redis
      - --redis-connection-url=redis://redis:6379
      - --cookie-name=_oauth2_proxy
      - --cookie-secret=${OAUTH2_COOKIE_SECRET:-DEV-LOCAL-NOT-PRODUCTION-0000000}
      - --cookie-secure=false
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --cookie-refresh=1h
      - --email-domain=*
      - --skip-provider-button=true
      - --set-xauthrequest=true
      - --pass-user-headers=true
      - --pass-access-token=false
      - --standard-logging=true
      - --auth-logging=true
      - --request-logging=true

      # Health check endpoints
      - --ping-path=/ping
      - --ready-path=/ready
      - --silence-ping-logging
    profiles:
      - integration
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4180/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # App service inherits build configuration from docker-compose.yml
  # (distroless base image with 0 HIGH/CRITICAL vulnerabilities)
  app:
    profiles:
      - integration
    ports:
      - "8081:8081"  # Expose health check port for test scripts
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-numberguess}:${POSTGRES_PASSWORD:-password}@postgres:5432/${TEST_DB_NAME:-numberguess_test}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
  selenium:
    image: seleniarm/standalone-chromium:latest
    shm_size: 2gb
    ports:
      - "4444:4444"
    environment:
      SE_START_XVFB: "true"
      SE_START_VNC: "false"
      SE_START_NO_VNC: "false"
      SE_SCREEN_WIDTH: "1920"
      SE_SCREEN_HEIGHT: "1080"
    profiles:
      - integration
    depends_on:
      oauth2-proxy:
        condition: service_healthy
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4444/status || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
