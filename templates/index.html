<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .game-form {
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        #game-area {
            display: none;
        }
        
        #game-area.active {
            display: block;
        }
        
        .game-info {
            background: #f7f7f7;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .game-info h2 {
            color: #555;
            margin-bottom: 10px;
        }
        
        .range-display {
            font-size: 1.2em;
            color: #667eea;
            font-weight: 600;
        }
        
        .guess-form {
            margin-bottom: 20px;
        }
        
        .guess-input-group {
            display: flex;
            gap: 10px;
        }
        
        .guess-input-group input {
            flex: 1;
        }
        
        .guess-input-group button {
            width: auto;
            padding: 12px 30px;
        }
        
        #feedback {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }
        
        #feedback.active {
            display: block;
        }
        
        #feedback.too-low {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        
        #feedback.too-high {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        
        #feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .new-game-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }
        
        .new-game-btn:hover {
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.4);
        }
        
        .new-game-link {
            display: inline-block;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .new-game-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .htmx-indicator {
            display: none;
        }
        
        .htmx-request .htmx-indicator {
            display: inline-block;
            margin-left: 10px;
        }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .guesses-remaining-box {
            margin-bottom: 20px;
        }

        .guesses-remaining {
            margin: 0;
            padding: 15px 20px;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-left: 5px solid #2196f3;
            border-radius: 8px;
            color: #1565c0;
            font-size: 1.2em;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.15);
        }

        /* Difficulty Indicator Styles */
        .form-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .form-container {
                grid-template-columns: 1fr;
            }
        }

        .difficulty-preview {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            align-self: start;
            position: sticky;
            top: 20px;
            min-height: 200px;
        }

        .difficulty-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .difficulty-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .difficulty-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            font-size: 1.1em;
            text-align: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .difficulty-icon {
            font-size: 1.3em;
        }

        .difficulty-name {
            letter-spacing: 0.5px;
        }

        .difficulty-meter-container {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .difficulty-meter {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .difficulty-stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
        }

        .stat-label {
            color: #666;
            font-weight: 600;
            font-size: 0.95em;
        }

        .stat-value {
            color: #333;
            font-weight: 700;
            font-size: 1em;
        }

        .difficulty-message {
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            color: #555;
            font-size: 0.95em;
            line-height: 1.5;
            font-style: italic;
        }

        .difficulty-preview:empty::before {
            content: "Adjust settings to see difficulty preview";
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Number Guessing Game</h1>
        
        <div id="setup-area">
            <div class="form-container">
                <form class="game-form"
                      hx-post="/game/new"
                      hx-target=".container"
                      hx-swap="innerHTML">
                    <input type="hidden" name="authenticity_token" value="{{ csrf_token }}">
                    <div class="form-group">
                        <label for="min">Minimum Number (0 to 1,000,000):</label>
                        <input type="number" id="min" name="min" value="1" min="0" max="1000000" required
                               hx-get="/difficulty-preview"
                               hx-trigger="input changed delay:300ms, load"
                               hx-include="[name='min'],[name='max'],[name='max_guesses']"
                               hx-target="#difficulty-preview">
                    </div>
                    <div class="form-group">
                        <label for="max">Maximum Number (0 to 1,000,000):</label>
                        <input type="number" id="max" name="max" value="100" min="0" max="1000000" required
                               hx-get="/difficulty-preview"
                               hx-trigger="input changed delay:300ms, load"
                               hx-include="[name='min'],[name='max'],[name='max_guesses']"
                               hx-target="#difficulty-preview">
                    </div>
                    <div class="form-group">
                        <label for="max_guesses">Guess Limit (Optional, max 100):</label>
                        <input type="number" id="max_guesses" name="max_guesses" min="0" max="100" placeholder="Leave blank for no limit"
                               hx-get="/difficulty-preview"
                               hx-trigger="input changed delay:300ms, load"
                               hx-include="[name='min'],[name='max'],[name='max_guesses']"
                               hx-target="#difficulty-preview">
                    </div>
                    <button type="submit">
                        Start New Game
                        <span class="htmx-indicator">
                            <span class="spinner"></span>
                        </span>
                    </button>
                </form>

                <!-- Difficulty preview sidebar -->
                <div id="difficulty-preview"
                     class="difficulty-preview"
                     role="region"
                     aria-live="polite"
                     aria-label="Difficulty preview">
                    <!-- HTMX will populate this on load and input change -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
