<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        /* ============ Parlor theme tokens ============ */
        :root {
            --ground: #F3EBDB;
            --surface: #FFFBF2;
            --ink: #2E2A22;
            --muted: #86795F;
            --line: #E4D8BE;
            --accent: #0F8A7B;
            --accent-ink: #FFFDF6;
            --accent-soft: #DFEEE7;
            --dir: #D04F32;
            --dir-ink: #FFF6EF;
            --win: #588F2E;
            --win-ink: #F6FBEE;
            --warn-fg: #A87A0C;
            --warn-bg: #F2E5C4;
            --crit-fg: #B23E24;
            --crit-bg: #F6D9D0;
            --tint: rgba(208, 79, 50, 0.08);
            --shadow: 0 6px 22px rgba(94, 78, 43, 0.14);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --ground: #211A10;
                --surface: #2E2517;
                --ink: #F1E8D6;
                --muted: #B3A184;
                --line: #463A24;
                --accent: #7B9DCB;
                --accent-ink: #121D2C;
                --accent-soft: #2B3240;
                --warn-fg: #E0B054;
                --warn-bg: #3A2F13;
                --crit-fg: #F08A6C;
                --crit-bg: #40170D;
                --tint: rgba(208, 79, 50, 0.07);
                --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
            }
        }

        /* ============ Base ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(680px 320px at 15% -10%, var(--tint), transparent 70%), var(--ground);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            line-height: 1.5;
        }

        .num {
            font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        .container {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 36px;
            max-width: 880px;
            width: 100%;
        }

        /* ============ Brand ============ */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 5px solid var(--accent);
            position: relative;
            flex: none;
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--dir);
        }

        h1 {
            font-size: 1.4em;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        /* ============ Forms & inputs ============ */
        label, .mini-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .field-hint {
            font-size: 12px;
            color: var(--muted);
            margin-top: 5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            color: var(--ink);
            font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
            font-variant-numeric: tabular-nums;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        input[type="number"]::placeholder {
            color: var(--muted);
            font-family: system-ui, sans-serif;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 22px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: var(--accent-ink);
            font-size: 15px;
            font-weight: 650;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: filter 0.15s;
        }

        button:hover {
            filter: brightness(1.06);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button:focus-visible, a:focus-visible {
            outline: 3px solid var(--accent-soft);
            outline-offset: 2px;
            box-shadow: 0 0 0 1.5px var(--accent);
        }

        .game-form button[type="submit"] {
            width: 100%;
            padding: 14px;
        }

        .new-game-btn {
            display: flex;
            width: fit-content;
            margin: 20px auto 0;
        }

        .new-game-link {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .new-game-link:hover {
            text-decoration: underline;
        }

        /* ============ Setup screen ============ */
        .form-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .form-container {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* ============ Difficulty preview ============ */
        .difficulty-preview {
            padding: 20px;
            background: var(--ground);
            border: 1px solid var(--line);
            border-radius: 14px;
            align-self: start;
            position: sticky;
            top: 20px;
            min-height: 200px;
        }

        .difficulty-preview:empty::before {
            content: "Adjust settings to see difficulty preview";
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--muted);
            font-style: italic;
        }

        .difficulty-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .difficulty-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .difficulty-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
            padding: 7px 14px;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.06em;
        }

        .difficulty-icon {
            font-size: 1.2em;
        }

        .difficulty-meter-container {
            width: 100%;
            height: 6px;
            background: var(--line);
            border-radius: 3px;
            overflow: hidden;
        }

        .difficulty-meter {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .difficulty-stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 16px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            color: var(--muted);
            font-weight: 550;
            font-size: 13.5px;
        }

        .stat-value {
            font-weight: 650;
            font-size: 13.5px;
            font-variant-numeric: tabular-nums;
        }

        .difficulty-message {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }

        /* ============ Play card ============ */
        #game-area {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .game-header .mini-label {
            margin-bottom: 2px;
        }

        .range-display {
            font-size: 18px;
            font-weight: 700;
        }

        /* Counter pill */
        .counter-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 650;
            background: var(--accent-soft);
            color: var(--accent);
        }

        .counter-pill .dots {
            display: inline-flex;
            gap: 3px;
        }

        .counter-pill .dots i {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.9;
        }

        .counter-pill .dots i.spent {
            opacity: 0.25;
        }

        .counter-pill.warn {
            background: var(--warn-bg);
            color: var(--warn-fg);
        }

        .counter-pill.crit {
            background: var(--crit-bg);
            color: var(--crit-fg);
        }

        .counter-pill.done:empty {
            display: none;
        }

        @media (prefers-reduced-motion: no-preference) {
            .counter-pill.crit {
                animation: pulse 1.6s ease-in-out infinite;
            }

            @keyframes pulse {
                50% { box-shadow: 0 0 0 5px var(--crit-bg); }
            }

            #feedback.hint {
                animation: settle 0.18s ease-out;
            }

            @keyframes settle {
                from { opacity: 0; transform: translateY(3px); }
                to { opacity: 1; transform: none; }
            }

            .track-labels .bound {
                animation: settle-x 0.18s ease-out;
            }

            @keyframes settle-x {
                from { opacity: 0; transform: translateX(-50%) translateY(3px); }
                to { opacity: 1; transform: translateX(-50%); }
            }
        }

        /* ============ Range tracker ============ */
        .tracker {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .track {
            position: relative;
            height: 10px;
            border-radius: 5px;
            background: var(--line);
        }

        .track-live {
            position: absolute;
            top: 0;
            bottom: 0;
            background: var(--accent);
            border-radius: 5px;
            opacity: 0.9;
            transition: left 0.3s ease, width 0.3s ease;
        }

        .track-mark {
            position: absolute;
            top: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            border: 2.5px solid var(--muted);
        }

        /* Bound labels: emphasis follows the closest known bound per side —
           the range ends at game start, the narrowing guesses once they exist */
        .track-labels {
            position: relative;
            height: 24px;
            font-size: 11px;
            color: var(--muted);
        }

        .track-labels .end {
            position: absolute;
            top: 4px;
        }

        .track-labels .end.lo {
            left: 0;
        }

        .track-labels .end.hi {
            right: 0;
        }

        .track-labels .bound {
            position: absolute;
            transform: translateX(-50%);
        }

        .track-labels .emph {
            top: 1px;
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
        }

        /* ============ Guess form & hint ============ */
        .guess-input-group {
            display: flex;
            gap: 10px;
        }

        .guess-input-group input {
            flex: 1;
        }

        .guess-input-group button {
            width: auto;
        }

        .hint {
            font-size: 13.5px;
            font-weight: 550;
            margin: 10px 0 0 2px;
        }

        .hint-muted {
            color: var(--muted);
            font-weight: 500;
        }

        /* ============ Feedback states ============ */
        #feedback.too-low, #feedback.too-high {
            color: var(--ink);
        }

        #feedback.error {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 16px;
            border-radius: 12px;
            background: var(--crit-bg);
            color: var(--crit-fg);
            font-size: 14.5px;
            font-weight: 550;
            margin-top: 10px;
        }

        .error-x {
            font-weight: 700;
        }

        /* Win / lose screens */
        .win-screen {
            text-align: center;
            padding: 0 0 4px;
            /* Pull the zoom cone up so it springs from the tracker bar
               (compensates the tracker margin + flex gap above #game-content) */
            margin-top: -58px;
        }

        /* Magnifier cone: dashed lines from the tracker, tangent to the
           halo. viewBox units equal 1% of card width on both axes (the
           aspect-ratio matches the viewBox), so the server-computed tangent
           geometry holds at any card width. The SVG extends past the halo's
           center height (40 units vs 24) because tangent points sit below
           center when the apex is far to one side. */
        .zoom-cone {
            display: block;
            width: 100%;
            aspect-ratio: 100 / 40;
        }

        .zoom-cone line {
            stroke: var(--win);
            stroke-width: 1.5;
            stroke-dasharray: 3 3;
            vector-effect: non-scaling-stroke;
            opacity: 0.65;
        }

        /* Width-proportional (radius 15% of the card) and pulled up so its
           center lands 24 cone-units below the bar, matching the tangent
           geometry (cone is 40 units tall; circle top belongs at unit 9:
           40 - 9 = 31% pull-up). Opaque fill + stacking context hide any
           residual line overlap behind the circle. */
        .halo {
            width: 30%;
            aspect-ratio: 1;
            margin: -31% auto 16px;
            border-radius: 50%;
            background: radial-gradient(closest-side, var(--accent-soft) 62%, var(--surface));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .halo::before {
            content: "";
            position: absolute;
            inset: 9%;
            border-radius: 50%;
            border: 2px dashed var(--win);
            opacity: 0.5;
        }

        .win-number {
            font-size: 54px;
            font-weight: 750;
            color: var(--win);
            letter-spacing: -0.02em;
        }

        .win-number-sm {
            font-size: 26px;
        }

        .track-mark.mark-win {
            border-color: var(--win);
            background: var(--win);
        }

        .win-title {
            font-size: 21px;
            margin-bottom: 4px;
        }

        .win-sub, .lose-sub {
            color: var(--muted);
            font-size: 14.5px;
        }

        .win-sub strong, .lose-sub strong {
            color: var(--ink);
        }

        #feedback.limit-reached {
            margin-top: 10px;
            padding: 14px 16px;
            border-radius: 12px;
            background: var(--ground);
            border: 1px solid var(--line);
        }

        .lose-title {
            font-weight: 650;
        }

        /* ============ HTMX loading indicator ============ */
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: inline-block;
        }

        .spinner {
            border: 3px solid var(--accent-soft);
            border-top: 3px solid var(--accent-ink);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <h1>Number Guessing Game</h1>
        </header>

        <div id="setup-area">
            <div class="form-container">
                <form class="game-form"
                      hx-post="/game/new"
                      hx-target=".container"
                      hx-swap="innerHTML">
                    <input type="hidden" name="authenticity_token" value="{{ csrf_token }}">
                    <div class="form-group">
                        <label for="min">Minimum number</label>
                        <input type="number" id="min" name="min" value="1" min="0" max="1000000" required
                               hx-get="/difficulty-preview"
                               hx-trigger="input changed delay:300ms, load"
                               hx-include="[name='min'],[name='max'],[name='max_guesses']"
                               hx-target="#difficulty-preview">
                        <div class="field-hint">0 &ndash; 1,000,000</div>
                    </div>
                    <div class="form-group">
                        <label for="max">Maximum number</label>
                        <input type="number" id="max" name="max" value="100" min="0" max="1000000" required
                               hx-get="/difficulty-preview"
                               hx-trigger="input changed delay:300ms"
                               hx-include="[name='min'],[name='max'],[name='max_guesses']"
                               hx-target="#difficulty-preview">
                        <div class="field-hint">0 &ndash; 1,000,000</div>
                    </div>
                    <div class="form-group">
                        <label for="max_guesses">Guess limit <span style="text-transform:none;letter-spacing:0;font-weight:550;">&mdash; optional</span></label>
                        <input type="number" id="max_guesses" name="max_guesses" min="0" max="100" placeholder="Leave blank for no limit"
                               hx-get="/difficulty-preview"
                               hx-trigger="input changed delay:300ms"
                               hx-include="[name='min'],[name='max'],[name='max_guesses']"
                               hx-target="#difficulty-preview">
                        <div class="field-hint">Max 100</div>
                    </div>
                    <button type="submit">
                        Start New Game
                        <span class="htmx-indicator"><span class="spinner"></span></span>
                    </button>
                </form>

                <!-- Difficulty preview sidebar -->
                <div id="difficulty-preview"
                     class="difficulty-preview"
                     role="region"
                     aria-live="polite"
                     aria-label="Difficulty preview">
                    <!-- HTMX populates this on load and input change -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
