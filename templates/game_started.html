<a class="back-link" href="/" aria-label="Quit this game and start a new one" title="Back to new game">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 3 5.5 8 10.5 13"/></svg>
</a>
<header class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Number Guessing Game</h1>
</header>
<div id="game-area" class="active">
    <div class="game-header">
        <div>
            <span class="mini-label">Guessing between</span>
            <span class="range-display num">{{ min }} &ndash; {{ max }}</span>
        </div>
        {% if show_counter %}
        <span id="counter" class="counter-pill">
            {% if dots_unspent > 0 %}<span class="dots" aria-hidden="true">{% for _i in 0..dots_unspent %}<i></i>{% endfor %}</span>{% endif %}
            <span class="visually-hidden">Guesses remaining:</span>
            <span class="num">{{ counter_label }}</span>
        </span>
        {% endif %}
    </div>

    <div class="tracker" aria-hidden="true">
        <div class="track">
            <div id="track-live" class="track-live" style="left:0%;width:100%"></div>
            <div id="track-marks"></div>
        </div>
        <div id="track-labels" class="track-labels num">
            <span class="end lo emph">{{ min }}</span>
            <span class="end hi emph">{{ max }}</span>
        </div>
    </div>

    <div id="game-content">
        <form class="guess-form"
              hx-post="/game/{{ game_id }}/guess"
              hx-target="#game-content"
              hx-swap="innerHTML">
            <input type="hidden" name="authenticity_token" value="{{ csrf_token }}">
            <input type="hidden" name="low" value="{{ min }}">
            <input type="hidden" name="high" value="{{ max }}">
            <div class="guess-input-group">
                <input type="number"
                       name="guess"
                       min="{{ min }}"
                       max="{{ max }}"
                       placeholder="Enter your guess"
                       required
                       autofocus>
                <button type="submit">
                    Guess
                    <span class="htmx-indicator"><span class="spinner"></span></span>
                </button>
            </div>
        </form>
        <p class="hint hint-muted">Start narrowing it down.</p>
    </div>
</div>
