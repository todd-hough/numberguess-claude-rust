# Mock authentication proxy for the LIGHT integration test tier.
#
# Stands in for the full oauth2-proxy + Keycloak + Redis + Selenium stack by
# injecting the same X-Forwarded-* identity headers that oauth2-proxy adds
# after a successful OAuth2 login. The identity below mirrors the real test
# user in keycloak/realm-export.json (admin / admin@local.test / group /admin)
# so light-tier tests see the same principal as full-tier tests.
#
# Used by docker-compose.test-mock-auth.yml (make test-func).
# The OAuth2 flow itself is still tested against the real stack (make test-auth).

events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;

        # Health endpoint proxied to the app's internal health port so the
        # nginx container healthcheck gates on app readiness (the app image is
        # distroless and cannot run its own healthcheck).
        location /health {
            proxy_pass http://app:8081/health;
        }

        location / {
            proxy_pass http://app:4080;
            proxy_set_header X-Forwarded-User "00000000-0000-4000-8000-mockuser0001";
            proxy_set_header X-Forwarded-Email "admin@local.test";
            proxy_set_header X-Forwarded-Preferred-Username "admin";
            proxy_set_header X-Forwarded-Groups "/admin";
            proxy_set_header Host $host;
            # Cookies (CSRF token) must round-trip untouched; nginx passes
            # Cookie/Set-Cookie through by default — do not filter them here.
        }
    }
}
